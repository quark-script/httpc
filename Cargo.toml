[package]
name = "httpc"
version = "0.1.0"
edition = "2021"
description = "A terminal-based HTTP client with a rich TUI"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
anyhow = "1"
